version: '3.8'

services:
  axiom:
    build: .
    container_name: axiom
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./config:/app/config
      - ./src:/app/src
    devices:
      - /dev/snd:/dev/snd
    environment:
      - PULSE_SERVER=unix:${XDG_RUNTIME_DIR}/pulse/native
    volumes:
      - ./config:/app/config
      - ${XDG_RUNTIME_DIR}/pulse/native:${XDG_RUNTIME_DIR}/pulse/native
